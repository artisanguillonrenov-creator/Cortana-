# Publishes the Cortana 2.0.0-rc13 GitHub Release from the signed files of this branch.
name: Publish release 2.0.0-rc13
on:
  push:
    branches: ["release-assets/2.0.0-rc13"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checksums
        run: sha256sum -c SHA256SUMS
      - name: Create release v2.0.0-rc13 on release/rc13 (0f3240d)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0-rc13 \
            --repo "$GITHUB_REPOSITORY" \
            --target 0f3240d098c56272ac95fb7d21726edcec61b79f \
            --title "Cortana 2.0.0-rc13" \
            --prerelease \
            --notes-file NOTES.md \
            cortana-2.0.0-rc13-arm64-v8a.apk cortana-2.0.0-rc13-universal.apk cortana-update.json SHA256SUMS
