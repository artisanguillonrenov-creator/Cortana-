# Publishes the Cortana 2.0.0-rc9 GitHub Release from the signed files of this branch.
name: Publish release 2.0.0-rc9
on:
  push:
    branches: ["release-assets/2.0.0-rc9"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checksums
        run: sha256sum -c SHA256SUMS
      - name: Create release v2.0.0-rc9 on release/rc9 (c15d497)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0-rc9 \
            --repo "$GITHUB_REPOSITORY" \
            --target c15d497f43d218d84d02da5399efe0b7ba4cc0b7 \
            --title "Cortana 2.0.0-rc9" \
            --prerelease \
            --notes-file NOTES.md \
            cortana-2.0.0-rc9-arm64-v8a.apk cortana-2.0.0-rc9-universal.apk cortana-update.json
