# Debug build, unit tests and lint of the Android app, the worker and the contracts, on work
# branches, on main and on pull requests to main (a required check before merging).
# Dependency verification (gradle/verification-metadata.xml) stays active; nothing is signed with
# the release key (debug build only, no secrets used).
name: Android build & tests

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK (platform 36, build-tools 36.0.0)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: ICU (regex compatibility check used by the tests)
        run: ls /usr/lib/x86_64-linux-gnu/libicui18n.so.* || (sudo apt-get update && sudo apt-get install -y libicu-dev)

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace --continue assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cortana-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests (contracts, worker, app)
        run: ./gradlew --no-daemon --stacktrace --continue :contracts:test :worker:test :app:testDebugUnitTest

      - name: Lint (debug)
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
            build/reports/dependency-verification/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
